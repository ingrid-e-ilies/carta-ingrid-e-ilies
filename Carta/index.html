<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Carta de Boda</title>
<style>
  :root {
    --ink: #1a1612;
    --paper: #f4ede1;
    --accent: #b08654;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0908;
    font-family: "Times New Roman", "Georgia", serif;
    color: var(--paper);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: grid;
    place-items: center;
    min-height: 100dvh;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100dvh;
    background: #000;
    overflow: hidden;
  }

  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    opacity: 0;
    transition: opacity 600ms ease;
  }
  video.is-active { opacity: 1; }
  #v2, #v5, #v6 {
    object-fit: contain;
    inset: 5%;
    width: 90%;
    height: 90%;
  }

  .v5-wrap, .v6-wrap {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    opacity: 0;
    transition: opacity 600ms ease;
  }
  .v5-wrap.is-active, .v6-wrap.is-active { opacity: 1; }
  #v5, #v6 {
    position: absolute;
    background: #000;
    opacity: 1;
  }

  /* Tap surface — full screen, transparent */
  .tap {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: transparent;
    display: grid;
    place-items: end center;
    padding-bottom: clamp(40px, 12vh, 120px);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 700ms ease;
  }
  .tap.is-visible {
    opacity: 1;
    pointer-events: auto;
  }

  .tap-inner {
    text-align: center;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    padding: 14px 28px;
    color: #fff;
    font-size: 15px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.6); opacity: 0.5; }
  }

  /* Initial start veil — needed because mobile browsers block autoplay-with-sound */
  .veil {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: grid;
    place-items: center;
    background:
      radial-gradient(120% 80% at 50% 30%, #2a1f15 0%, #0a0706 60%, #000 100%);
    color: var(--paper);
    text-align: center;
    padding: 24px;
    cursor: pointer;
    transition: opacity 700ms ease;
  }
  .veil.is-hidden {
    opacity: 0;
    pointer-events: none;
  }
  .veil h1 {
    font-family: "Didot", "Bodoni 72", "Playfair Display", "Times New Roman", serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(38px, 9vw, 64px);
    letter-spacing: 0.02em;
    margin: 0 0 8px;
    color: var(--paper);
  }
  .veil .ampersand {
    display: block;
    color: var(--accent);
    font-size: clamp(60px, 14vw, 110px);
    line-height: 1;
    margin: 6px 0 14px;
    font-style: italic;
  }
  .veil p.kicker {
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(244, 237, 225, 0.6);
    margin: 0 0 28px;
  }
  .veil .start-cta {
    margin-top: 36px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(244, 237, 225, 0.4);
    color: var(--paper);
    padding: 12px 22px;
    border-radius: 999px;
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
  }

  /* End veil after video 2 */
  .end {
    position: absolute;
    inset: 0;
    z-index: 25;
    display: grid;
    place-items: center;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 800ms ease;
    text-align: center;
    padding: 24px;
  }
  .end.is-visible { opacity: 1; pointer-events: auto; }
  .end .replay {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(255,255,255,0.45);
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    cursor: pointer;
    background: transparent;
  }
</style>
</head>
<body>
  <div class="stage" id="stage" data-screen-label="01 Carta de Boda">

    <!-- Initial tap-to-start veil -->
    <div class="veil" id="veil" role="button" aria-label="Comenzar">
      <div>
        <p class="kicker">Carta de boda</p>
        <h1>Para ti</h1>
        <span class="ampersand">&amp;</span>
        <p class="kicker">Toca para abrir</p>
        <div class="start-cta">
          <span class="pulse-dot"></span>
          Comenzar
        </div>
      </div>
    </div>

    <!-- Background music -->
    <audio id="bgm" src="cancion_carta.mp3" loop preload="auto"></audio>

    <!-- Sequential videos -->
    <video id="v1" playsinline preload="auto" src="video1.mp4" muted></video>
    <video id="v2" playsinline preload="auto" src="video2.mp4" muted></video>
    <div class="v5-wrap" id="v5wrap">
      <video id="v5" playsinline preload="auto" src="video5.mp4" muted></video>
    </div>
    <div class="v6-wrap" id="v6wrap">
      <video id="v6" playsinline preload="auto" src="video6.mp4" muted></video>
    </div>

    <!-- Tap-to-continue layer (between v1 and v2) -->
    <div class="tap" id="tap" role="button" aria-label="Continuar">
      <div class="tap-inner">
        <span class="pulse-dot"></span>
        Toca para continuar
      </div>
    </div>

    <!-- End state -->
    <div class="end" id="end">
      <button class="replay" id="replay">↻ Volver a ver</button>
    </div>
  </div>

<script>
(function () {
  const stage = document.getElementById('stage');
  const veil  = document.getElementById('veil');
  const v1    = document.getElementById('v1');
  const v2    = document.getElementById('v2');
  const v5    = document.getElementById('v5');
  const v5wrap = document.getElementById('v5wrap');
  const v6    = document.getElementById('v6');
  const v6wrap = document.getElementById('v6wrap');
  const bgm   = document.getElementById('bgm');
  const tap   = document.getElementById('tap');
  const end   = document.getElementById('end');
  const replayBtn = document.getElementById('replay');

  let phase = 'idle'; // idle | playing1 | waiting | playing2 | waiting5 | playing5 | waiting6 | playing6 | replay2 | done


  function setActive(target) {
    [v1, v2].forEach(v => v.classList.toggle('is-active', v === target));
    v5wrap.classList.toggle('is-active', target === v5wrap);
    v6wrap.classList.toggle('is-active', target === v6wrap);
  }

  async function safePlay(video) {
    try {
      await video.play();
    } catch (err) {
      // Autoplay with sound may be blocked; retry muted as fallback
      try {
        video.muted = true;
        await video.play();
      } catch (e) {
        console.warn('play blocked', e);
      }
    }
  }

  function startSequence() {
    if (phase !== 'idle' && phase !== 'done') return;
    veil.classList.add('is-hidden');
    end.classList.remove('is-visible');
    tap.classList.remove('is-visible');

    phase = 'playing1';
    v1.currentTime = 0;
    v2.currentTime = 0;
    v5.currentTime = 0;
    v6.currentTime = 0;
    v1.muted = true;
    v2.muted = true;
    v5.muted = true;
    v6.muted = true;
    setActive(v1);
    safePlay(v1);
  }

  function playBGM() {
    bgm.currentTime = 0;
    bgm.muted = false;
    bgm.play().catch(() => {
      bgm.muted = true;
      bgm.play().then(() => { bgm.muted = false; }).catch(() => {});
    });
  }

  // First tap starts everything — bgm.play() must be called directly from the gesture
  veil.addEventListener('click', () => { playBGM(); startSequence(); });
  veil.addEventListener('touchstart', (e) => { e.preventDefault(); playBGM(); startSequence(); }, { passive: false });

  // When video 1 ends → show tap-to-continue
  v1.addEventListener('ended', () => {
    phase = 'waiting';
    // Hold the last frame of v1 visible
    try { v1.pause(); } catch (e) {}
    tap.classList.add('is-visible');
  });

  // Tap anywhere on the screen to continue
  function handleTap() {
    if (phase === 'waiting') {
      phase = 'playing2';
      tap.classList.remove('is-visible');
      setActive(v2);
      safePlay(v2);
    } else if (phase === 'waiting5') {
      phase = 'playing5';
      tap.classList.remove('is-visible');
      setActive(v5wrap);
      safePlay(v5);
    } else if (phase === 'waiting6') {
      phase = 'playing6';
      tap.classList.remove('is-visible');
      setActive(v6wrap);
      safePlay(v6);
    } else if (phase === 'replay2') {
      phase = 'playing2';
      tap.classList.remove('is-visible');
      v2.currentTime = 0;
      setActive(v2);
      safePlay(v2);
    }
  }
  tap.addEventListener('click', handleTap);
  tap.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(); }, { passive: false });

  // When video 2 ends → wait for tap to start video 5
  v2.addEventListener('ended', () => {
    phase = 'waiting5';
    try { v2.pause(); } catch (e) {}
    tap.classList.add('is-visible');
  });

  // When video 5 ends → wait for tap to start video 6
  v5.addEventListener('ended', () => {
    phase = 'waiting6';
    try { v5.pause(); } catch (e) {}
    tap.classList.add('is-visible');
  });

  // When video 6 ends → wait for tap to go back to video 2
  v6.addEventListener('ended', () => {
    phase = 'replay2';
    try { v6.pause(); } catch (e) {}
    tap.classList.add('is-visible');
  });

  replayBtn.addEventListener('click', () => {
    playBGM();
    end.classList.remove('is-visible');
    phase = 'idle';
    startSequence();
  });
})();
</script>
</body>
</html>
